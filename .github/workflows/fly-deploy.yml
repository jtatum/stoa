# Called by test.yml only after Required checks succeeds on a push to main.
# Deploy the exact image built, scanned, and smoke-tested in that workflow run.

name: Deploy to Fly.io

on:
  workflow_call:
    secrets:
      FLY_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Defense in depth: reusable deployment cannot run for pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # master

      - name: Download the validated runtime image from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: runtime-image-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-image

      - name: Push and deploy the validated image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE: stoa:ci-${{ github.sha }}
          DEPLOY_IMAGE: registry.fly.io/stoa-murmur:ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          trap 'docker logout registry.fly.io >/dev/null 2>&1 || true' EXIT
          gunzip -c "$RUNNER_TEMP/runtime-image/runtime-image.tar.gz" | docker load
          docker tag "$IMAGE" "$DEPLOY_IMAGE"
          flyctl auth docker
          docker push "$DEPLOY_IMAGE"
          # Resolve the pushed digest so deployment cannot follow a mutable tag.
          digest=$(docker image inspect "$DEPLOY_IMAGE" | \
            jq -er '.[0].RepoDigests[] | select(startswith("registry.fly.io/stoa-murmur@sha256:"))')
          flyctl deploy --app stoa-murmur --image "$digest"
